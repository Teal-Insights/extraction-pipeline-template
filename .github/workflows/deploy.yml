name: Deploy generated package

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Resolve deploy target from workbook config
        id: target
        run: |
          slug="$(uv run python -c "from src.pipeline_config import load_pipeline_config; print(load_pipeline_config().dist_metadata.repository_slug() or '')")"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          if [ -n "${slug}" ]; then
            echo "Deploy target: ${slug}"
          else
            echo "No GitHub repository_url configured in DIST_METADATA; skipping package-repo publish."
          fi

      - name: Run export pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m src.extraction_pipeline

      - name: Checkout target repository
        if: steps.target.outputs.slug != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.target.outputs.slug }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: target-repo

      - name: Sync dist to target repository
        if: steps.target.outputs.slug != ''
        run: rsync -a --delete --exclude ".git/" dist/ target-repo/

      - name: Commit and push changes
        if: steps.target.outputs.slug != ''
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        working-directory: target-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code && git diff --cached --quiet --exit-code; then
            echo "No changes to deploy."
            exit 0
          fi

          git add -A
          if git diff --cached --quiet --exit-code; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "Deploy generated package from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin HEAD:main

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-package
          path: dist/
